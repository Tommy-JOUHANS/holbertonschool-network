<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arr-enc" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803d"/>
    </marker>
    <marker id="arr-ret" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#f8fafc"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">What Happens When You Type https://www.google.com</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b">Complete request lifecycle — from browser to database and back</text>

  <!-- ══════════════════════════════════════════════
       BROWSER
  ══════════════════════════════════════════════ -->
  <rect x="20" y="250" width="110" height="120" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="296" text-anchor="middle" font-size="28">💻</text>
  <text x="75" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Browser</text>
  <text x="75" y="338" text-anchor="middle" font-size="10" fill="#3b82f6">User types URL</text>
  <text x="75" y="352" text-anchor="middle" font-size="10" fill="#3b82f6">presses Enter</text>

  <!-- ══════════════════════════════════════════════
       DNS
  ══════════════════════════════════════════════ -->
  <rect x="160" y="80" width="120" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="118" text-anchor="middle" font-size="24">🌐</text>
  <text x="220" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">DNS Resolver</text>
  <text x="220" y="159" text-anchor="middle" font-size="9.5" fill="#6d28d9">www.google.com</text>
  <text x="220" y="172" text-anchor="middle" font-size="9.5" fill="#6d28d9">→ 142.250.x.x</text>

  <!-- Browser → DNS (dashed, lookup) -->
  <line x1="130" y1="280" x2="220" y2="182" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <rect x="130" y="218" width="68" height="18" rx="4" fill="#ede9fe"/>
  <text x="164" y="231" text-anchor="middle" font-size="9" fill="#6d28d9">① DNS lookup</text>

  <!-- DNS → Browser (IP returned, dashed) -->
  <line x1="195" y1="182" x2="115" y2="286" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="126" y="252" text-anchor="middle" font-size="9" fill="#6d28d9">IP returned</text>

  <!-- ══════════════════════════════════════════════
       FIREWALL
  ══════════════════════════════════════════════ -->
  <rect x="160" y="250" width="120" height="120" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="296" text-anchor="middle" font-size="26">🛡️</text>
  <text x="220" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Firewall</text>
  <text x="220" y="338" text-anchor="middle" font-size="9.5" fill="#dc2626">Inspects packets</text>
  <text x="220" y="352" text-anchor="middle" font-size="9.5" fill="#dc2626">Allows port 443</text>
  <text x="220" y="365" text-anchor="middle" font-size="9.5" fill="#dc2626">Blocks threats</text>

  <!-- Browser → Firewall (TCP :443) -->
  <line x1="132" y1="310" x2="158" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="106" y="296" width="72" height="16" rx="3" fill="#f1f5f9"/>
  <text x="142" y="308" text-anchor="middle" font-size="8.5" fill="#334155">② TCP :443</text>

  <!-- ══════════════════════════════════════════════
       LOAD BALANCER
  ══════════════════════════════════════════════ -->
  <rect x="330" y="250" width="130" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="296" text-anchor="middle" font-size="26">⚖️</text>
  <text x="395" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Load Balancer</text>
  <text x="395" y="338" text-anchor="middle" font-size="9.5" fill="#16a34a">Distributes traffic</text>
  <text x="395" y="352" text-anchor="middle" font-size="9.5" fill="#16a34a">Health checks</text>
  <text x="395" y="365" text-anchor="middle" font-size="9.5" fill="#16a34a">Geo-based routing</text>

  <!-- Firewall → Load Balancer (HTTPS encrypted) -->
  <line x1="282" y1="310" x2="328" y2="310" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-enc)"/>
  <rect x="280" y="292" width="52" height="16" rx="3" fill="#dcfce7"/>
  <text x="306" y="304" text-anchor="middle" font-size="8" fill="#15803d">🔒 HTTPS</text>
  <text x="306" y="316" text-anchor="middle" font-size="7.5" fill="#15803d">encrypted</text>

  <!-- ══════════════════════════════════════════════
       WEB SERVER
  ══════════════════════════════════════════════ -->
  <rect x="520" y="250" width="130" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="585" y="296" text-anchor="middle" font-size="26">🖥️</text>
  <text x="585" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Web Server</text>
  <text x="585" y="338" text-anchor="middle" font-size="9.5" fill="#d97706">nginx / Apache</text>
  <text x="585" y="352" text-anchor="middle" font-size="9.5" fill="#d97706">HTTP headers</text>
  <text x="585" y="365" text-anchor="middle" font-size="9.5" fill="#d97706">Serves web page</text>

  <!-- LB → Web Server (HTTPS encrypted) -->
  <line x1="462" y1="310" x2="518" y2="310" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-enc)"/>
  <rect x="457" y="292" width="62" height="16" rx="3" fill="#dcfce7"/>
  <text x="488" y="304" text-anchor="middle" font-size="8" fill="#15803d">🔒 HTTPS</text>
  <text x="488" y="316" text-anchor="middle" font-size="7.5" fill="#15803d">encrypted</text>

  <!-- ══════════════════════════════════════════════
       APP SERVER
  ══════════════════════════════════════════════ -->
  <rect x="520" y="430" width="130" height="120" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="585" y="476" text-anchor="middle" font-size="26">⚙️</text>
  <text x="585" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">App Server</text>
  <text x="585" y="518" text-anchor="middle" font-size="9.5" fill="#ea580c">Business logic</text>
  <text x="585" y="532" text-anchor="middle" font-size="9.5" fill="#ea580c">Page generation</text>
  <text x="585" y="546" text-anchor="middle" font-size="9.5" fill="#ea580c">Internal APIs</text>

  <!-- Web Server → App Server -->
  <line x1="585" y1="372" x2="585" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="610" y="405" text-anchor="middle" font-size="9" fill="#334155">dynamic</text>
  <text x="610" y="417" text-anchor="middle" font-size="9" fill="#334155">request</text>

  <!-- App Server → Web Server (response back) -->
  <line x1="570" y1="428" x2="570" y2="374" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-ret)"/>

  <!-- ══════════════════════════════════════════════
       DATABASE
  ══════════════════════════════════════════════ -->
  <rect x="730" y="430" width="130" height="120" rx="14" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="476" text-anchor="middle" font-size="26">🗄️</text>
  <text x="795" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">Database</text>
  <text x="795" y="518" text-anchor="middle" font-size="9.5" fill="#4338ca">Search indexes</text>
  <text x="795" y="532" text-anchor="middle" font-size="9.5" fill="#4338ca">User preferences</text>
  <text x="795" y="546" text-anchor="middle" font-size="9.5" fill="#4338ca">Metadata</text>

  <!-- App Server → Database -->
  <line x1="652" y1="490" x2="728" y2="490" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="690" y="482" text-anchor="middle" font-size="9" fill="#334155">SQL query</text>

  <!-- Database → App Server (results) -->
  <line x1="728" y1="505" x2="652" y2="505" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-ret)"/>
  <text x="690" y="520" text-anchor="middle" font-size="9" fill="#6d28d9">results</text>

  <!-- ══════════════════════════════════════════════
       RESPONSE PATH — Web Server back to Browser
  ══════════════════════════════════════════════ -->
  <!-- Web Server → LB response -->
  <line x1="518" y1="325" x2="462" y2="325" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-ret)"/>
  <!-- LB → Firewall response -->
  <line x1="328" y1="325" x2="284" y2="325" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-ret)"/>
  <!-- Firewall → Browser response -->
  <line x1="158" y1="325" x2="132" y2="325" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-ret)"/>

  <!-- Response label below the return path -->
  <rect x="210" y="332" width="260" height="16" rx="4" fill="#ede9fe"/>
  <text x="340" y="344" text-anchor="middle" font-size="9" fill="#6d28d9">← encrypted HTTPS response (TLS) — HTML page</text>

  <!-- ══════════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════════ -->
  <rect x="20" y="430" width="290" height="130" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="452" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Legend</text>
  <!-- request -->
  <line x1="36" y1="468" x2="76" y2="468" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="84" y="472" font-size="10" fill="#334155">Request / unencrypted</text>
  <!-- encrypted -->
  <line x1="36" y1="488" x2="76" y2="488" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-enc)"/>
  <text x="84" y="492" font-size="10" fill="#15803d">🔒 Encrypted (HTTPS / TLS)</text>
  <!-- response -->
  <line x1="36" y1="508" x2="76" y2="508" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-ret)"/>
  <text x="84" y="512" font-size="10" fill="#6d28d9">Response (dashed)</text>
  <!-- dns -->
  <line x1="36" y1="528" x2="76" y2="528" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="84" y="532" font-size="10" fill="#6d28d9">DNS lookup (dashed)</text>
  <!-- port -->
  <text x="36" y="552" font-size="10" fill="#334155">Port 443 — all traffic uses HTTPS on TCP port 443</text>

  <!-- ══════════════════════════════════════════════
       STEP NUMBERS
  ══════════════════════════════════════════════ -->
  <circle cx="160" cy="80" r="10" fill="#7c3aed"/>
  <text x="160" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
  <circle cx="160" cy="250" r="10" fill="#dc2626"/>
  <text x="160" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
  <circle cx="330" cy="250" r="10" fill="#16a34a"/>
  <text x="330" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
  <circle cx="520" cy="250" r="10" fill="#d97706"/>
  <text x="520" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4</text>
  <circle cx="520" cy="430" r="10" fill="#ea580c"/>
  <text x="520" y="434" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
  <circle cx="730" cy="430" r="10" fill="#4338ca"/>
  <text x="730" y="434" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">6</text>

  <!-- Step labels at bottom -->
  <text x="220" y="590" text-anchor="middle" font-size="9" fill="#7c3aed">① DNS</text>
  <text x="220" y="602" text-anchor="middle" font-size="9" fill="#dc2626">② Firewall</text>
  <text x="395" y="590" text-anchor="middle" font-size="9" fill="#16a34a">③ Load Balancer</text>
  <text x="585" y="590" text-anchor="middle" font-size="9" fill="#d97706">④ Web Server</text>
  <text x="585" y="602" text-anchor="middle" font-size="9" fill="#ea580c">⑤ App Server</text>
  <text x="795" y="590" text-anchor="middle" font-size="9" fill="#4338ca">⑥ Database</text>
</svg>
